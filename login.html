
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SubHub | Login</title>
<meta name="description" content="Login to your SubHub account. Buy cheap data bundles, airtime, pay bills and earn rewards instantly.">
<meta name="theme-color" content="#00aaff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/login.css">
<link rel="icon" type="image/png" href="logo.png">
</head>
<body>

<!-- BG -->
<div class="bg-grid"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<!-- THEME TOGGLE -->
<button class="theme-toggle" id="themeToggle" title="Toggle theme">
  <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg id="iconSun"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- FORGOT PASSWORD MODAL -->
<div class="modal-ov" id="forgotModal">
  <div class="modal-box">
    <button class="modal-close" id="forgotClose">✕</button>
    <div class="modal-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="modal-title">Reset your password</div>
    <div class="modal-sub">Enter your email address and we'll send you a link to reset your password.</div>
    <div class="modal-field">
      <label for="fpEmail">Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </span>
        <input type="email" id="fpEmail" placeholder="Enter your email address"/>
      </div>
    </div>
    <div class="modal-err" id="fpErr"></div>
    <div class="modal-success" id="fpSuccess">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Reset link sent! Check your inbox.
    </div>
    <button class="btn-submit" id="fpSubmit">
      <span class="btn-text" style="display:flex;align-items:center;gap:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Send Reset Link
      </span>
      <div class="btn-spinner"></div>
    </button>
  </div>
</div>

<!-- MAIN -->
<div class="wrapper">

  <!-- LOGO -->
  <div class="logo-wrap">
    <a href="/" class="logo">
      <img class="logo-img" id="logoImg" src="logo.png" alt="SubHub" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex'">
      <div class="logo-icon-fallback" id="logoFallback">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div><div class="logo-text">Sub<span>Hub</span></div></div>
    </a>
    <p class="logo-sub">Nigeria's fastest data &amp; airtime platform</p>
  </div>

  <!-- CARD -->
  <div class="card">
    <div class="card-header">
      <h1 class="card-title">Welcome back 👋</h1>
      <p class="card-sub">Sign in to your SubHub account to continue</p>
    </div>

    <div class="form" id="loginForm">

      <!-- Credential -->
      <div class="field">
        <label for="credential">Email, Username or Phone</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input type="text" id="credential" placeholder="e.g. zainab, 08012345678 or email" autocomplete="username"/>
        </div>
        <span class="field-error" id="credErr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="credErrTxt"></span>
        </span>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
          <button type="button" class="pwd-toggle" id="togglePwd">
            <svg id="eyeShow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeHide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <span class="field-error" id="pwdErr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="pwdErrTxt"></span>
        </span>
      </div>

      <!-- Remember Me + Forgot -->
      <div class="form-meta">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe"/>
          Remember me
        </label>
        <button type="button" class="forgot-btn" id="forgotBtn">Forgot password?</button>
      </div>

      <!-- Submit -->
      <button type="button" class="btn-submit" id="loginBtn">
        <span class="btn-text" style="display:flex;align-items:center;gap:8px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign In
        </span>
        <div class="btn-spinner"></div>
      </button>

    </div>
  

  <p class="signin-link">Don't have an account? <a href="sign-up.html">Create one free →</a></p>
</div>
</div>
<script src="assets/js/login.js"></script>
</body>
</html>
