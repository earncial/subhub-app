<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Offline • SubHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --brand: #00aaff;
  --brand-dim: rgba(0,170,255,0.10);
  --brand-glow: rgba(0,170,255,0.30);
  --brand-dark: #0088cc;
  --success: #00c07a;
  --error: #e8334a;
  --font-display: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 14px;
  --radius-sm: 10px;
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
}

[data-theme="light"] {
  --bg: #f3f8ff; --bg2: #e8f2ff;
  --surface: #ffffff; --surface2: #f7faff;
  --border: rgba(0,100,200,0.10); --border-focus: rgba(0,170,255,0.55);
  --text: #0d1a2e; --text-muted: #8096b8; --text-sub: #4d6480;
  --shadow: rgba(0,80,180,0.10); --grid-color: rgba(0,120,255,0.06);
}
[data-theme="dark"] {
  --bg: #080c12; --bg2: #0d1117;
  --surface: #111820; --surface2: #161e2a;
  --border: rgba(255,255,255,0.07); --border-focus: rgba(0,170,255,0.5);
  --text: #eef2ff; --text-muted: #6b7a99; --text-sub: #8896b3;
  --shadow: rgba(0,0,0,0.6); --grid-color: rgba(255,255,255,0.04);
}

html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-display);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
  transition: background 0.3s, color 0.3s;
}

.bg-grid {
  position: fixed; inset: 0;
  background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none; z-index: 0;
}
.bg-orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
.bg-orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,170,255,0.12), transparent 70%); top: -150px; right: -100px; animation: orbFloat 8s ease-in-out infinite; }
.bg-orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(0,170,255,0.07), transparent 70%); bottom: -100px; left: -100px; animation: orbFloat 10s ease-in-out infinite reverse; }
@keyframes orbFloat { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-30px) scale(1.05); } }

.theme-toggle {
  position: fixed; top: 20px; right: 20px; z-index: 100;
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--surface);
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); box-shadow: 0 4px 20px var(--shadow);
}
.theme-toggle:hover { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px var(--brand-dim); transform: scale(1.08); }
.theme-toggle svg { width: 18px; height: 18px; }

.wrapper {
  position: relative; z-index: 1;
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column;
  align-items: center; text-align: center;
  gap: 0;
}

/* STICKER */
.sticker-wrap {
  position: relative;
  margin-bottom: 8px;
  animation: fadeUp 0.6s ease both;
  cursor: pointer;
  user-select: none;
}
.sticker {
  width: 200px; height: 200px;
  position: relative;
  animation: stickerFloat 4s ease-in-out infinite;
  transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
  filter: drop-shadow(0 20px 40px rgba(0,170,255,0.25));
}
.sticker:hover { transform: scale(1.08) rotate(-3deg); }
.sticker:active { transform: scale(0.94) rotate(2deg); }
.sticker svg { width: 100%; height: 100%; }
.sticker.wobble { animation: wobble 0.5s cubic-bezier(0.36,0.07,0.19,0.97); }
@keyframes wobble {
  0%   { transform: rotate(0deg) scale(1); }
  15%  { transform: rotate(-8deg) scale(1.05); }
  30%  { transform: rotate(6deg) scale(1.05); }
  45%  { transform: rotate(-5deg) scale(1.03); }
  60%  { transform: rotate(4deg) scale(1.02); }
  75%  { transform: rotate(-2deg) scale(1.01); }
  100% { transform: rotate(0deg) scale(1); }
}

.star {
  position: absolute; border-radius: 50%; background: var(--brand);
  animation: starTwinkle var(--d, 2s) ease-in-out infinite var(--delay, 0s);
}
@keyframes starTwinkle {
  0%,100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* OFFLINE LABEL */
.offline-label {
  font-size: clamp(3.5rem, 16vw, 5.5rem);
  font-weight: 900;
  letter-spacing: -3px;
  line-height: 1;
  background: linear-gradient(135deg, var(--brand) 0%, #0055aa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 0.7s ease 0.1s both;
  position: relative;
  margin-bottom: 4px;
}
.offline-label::after {
  content: 'OFFLINE';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--brand) 0%, #0055aa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: blur(18px);
  opacity: 0.35;
  z-index: -1;
}

/* CARD */
.card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px;
  padding: 32px 28px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 20px 60px var(--shadow);
  position: relative; overflow: hidden;
  animation: fadeUp 0.7s ease 0.2s both;
  width: 100%;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--brand), transparent);
  opacity: 0.6;
}

.card-title { font-size: 1.3rem; font-weight: 800; color: var(--text); letter-spacing: -0.4px; margin-bottom: 8px; }
.card-sub { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }

/* STATUS ROW */
.status-row {
  display: flex; gap: 8px; flex-direction: column;
  margin-bottom: 20px;
}
.status-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 0.82rem; color: var(--text-sub); text-align: left;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.status-dot.red { background: var(--error); box-shadow: 0 0 6px var(--error); animation: pulse 1.2s ease-in-out infinite; }
.status-dot.yellow { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; animation: pulse 1.6s ease-in-out infinite; }
.status-dot.green { background: var(--success); box-shadow: 0 0 6px var(--success); }
.status-label { font-weight: 700; color: var(--text); margin-right: 4px; }

@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 6px;
  background: var(--brand-dim); border: 1px solid rgba(0,170,255,0.2);
  font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700;
  color: var(--brand); margin-bottom: 16px;
  animation: fadeUp 0.6s ease 0.15s both;
}
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: pulse 1.5s ease-in-out infinite; }

/* BUTTONS */
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-primary {
  flex: 1; min-width: 120px; padding: 13px 20px;
  background: linear-gradient(135deg, var(--brand), #0070cc);
  border: none; border-radius: var(--radius-sm); color: white;
  font-family: var(--font-display); font-size: 0.88rem; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform var(--transition), box-shadow var(--transition);
  box-shadow: 0 6px 24px var(--brand-glow);
  text-decoration: none;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 36px var(--brand-glow); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary {
  flex: 1; min-width: 120px; padding: 13px 20px;
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text-sub);
  font-family: var(--font-display); font-size: 0.88rem; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: var(--transition); text-decoration: none;
}
.btn-secondary:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-dim); }
.btn-primary svg, .btn-secondary svg { width: 16px; height: 16px; flex-shrink: 0; }

/* LOGO */
.logo-wrap { margin-bottom: 20px; animation: fadeUp 0.5s ease both; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-img {
  width: 36px; height: 36px; border-radius: 10px; object-fit: contain;
  box-shadow: 0 4px 16px var(--brand-glow);
  background: var(--surface); padding: 3px;
  border: 1.5px solid var(--border);
}
.logo-text { font-size: 1.3rem; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
.logo-text span { color: var(--brand); }

@keyframes stickerFloat {
  0%,100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-14px) rotate(1deg); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Spinning WiFi ring */
@keyframes spinRing {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@media (max-width: 480px) {
  .card { padding: 24px 18px; }
  .sticker { width: 160px; height: 160px; }
  .btn-row { flex-direction: column; }
  .btn-primary, .btn-secondary { flex: none; width: 100%; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
  <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
</button>

<div class="wrapper">

  <!-- Logo -->
  <div class="logo-wrap">
    <a href="/" class="logo">
      <img src="/logo.png" alt="SubHub" class="logo-img" onerror="this.style.display='none'">
      <span class="logo-text">Sub<span>Hub</span></span>
    </a>
  </div>

  <!-- Sticker -->
  <div class="sticker-wrap">
    <div class="star" style="width:5px;height:5px;top:10px;left:30px;--d:2.1s;--delay:0s;"></div>
    <div class="star" style="width:4px;height:4px;top:25px;right:25px;--d:1.7s;--delay:0.3s;"></div>
    <div class="star" style="width:3px;height:3px;top:60px;left:8px;--d:2.4s;--delay:0.6s;"></div>
    <div class="star" style="width:5px;height:5px;bottom:30px;right:15px;--d:1.9s;--delay:0.9s;"></div>
    <div class="star" style="width:3px;height:3px;bottom:50px;left:20px;--d:2.2s;--delay:0.4s;"></div>
    <div class="star" style="width:4px;height:4px;top:80px;right:5px;--d:1.6s;--delay:0.7s;"></div>

    <div class="sticker" id="sticker" onclick="wobbleSticker()">
      <!-- Offline / No WiFi SVG sticker -->
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bgGlow" cx="50%" cy="50%">
            <stop offset="0%" stop-color="rgba(0,170,255,0.08)"/>
            <stop offset="100%" stop-color="transparent"/>
          </radialGradient>
          <radialGradient id="phoneGrad" cx="35%" cy="25%">
            <stop offset="0%" stop-color="#e8f6ff"/>
            <stop offset="100%" stop-color="#a0d8f8"/>
          </radialGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <!-- Background circle -->
        <circle cx="100" cy="100" r="90" fill="url(#bgGlow)" stroke="rgba(0,170,255,0.12)" stroke-width="1"/>

        <!-- Spinning dashed ring (searching...) -->
        <circle cx="100" cy="85" r="60" fill="none" stroke="rgba(0,170,255,0.18)" stroke-width="2" stroke-dasharray="12 8" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 100 85" to="360 100 85" dur="4s" repeatCount="indefinite"/>
        </circle>

        <!-- WiFi arcs — broken/greyed -->
        <!-- Arc 3 (outermost) — grey, crossed out feel -->
        <path d="M 52 82 Q 100 38 148 82" stroke="rgba(150,180,210,0.35)" stroke-width="6" fill="none" stroke-linecap="round"/>
        <!-- Arc 2 — grey -->
        <path d="M 64 94 Q 100 62 136 94" stroke="rgba(150,180,210,0.45)" stroke-width="6" fill="none" stroke-linecap="round"/>
        <!-- Arc 1 — partial blue, flickering -->
        <path d="M 78 108 Q 100 88 122 108" stroke="#00aaff" stroke-width="6" fill="none" stroke-linecap="round">
          <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
        </path>
        <!-- Center dot -->
        <circle cx="100" cy="120" r="6" fill="#00aaff" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>

        <!-- Big X cross over WiFi -->
        <line x1="68" y1="58" x2="132" y2="122" stroke="#e8334a" stroke-width="5" stroke-linecap="round">
          <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
        </line>
        <line x1="132" y1="58" x2="68" y2="122" stroke="#e8334a" stroke-width="5" stroke-linecap="round">
          <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
        </line>

        <!-- Exclamation badge bottom -->
        <circle cx="100" cy="165" r="18" fill="#fff3cd" stroke="#f59e0b" stroke-width="2"/>
        <text x="100" y="172" text-anchor="middle" font-size="20" font-weight="900" fill="#d97706" font-family="Plus Jakarta Sans, sans-serif">!</text>

        <!-- Floating dots (searching signal) -->
        <circle cx="42" cy="100" r="3.5" fill="#00aaff" opacity="0.7">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="r" values="3.5;5;3.5" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="158" cy="100" r="3.5" fill="#00aaff" opacity="0.7">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1s" begin="0.4s" repeatCount="indefinite"/>
          <animate attributeName="r" values="3.5;5;3.5" dur="1s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="100" cy="30" r="3" fill="#00aaff" opacity="0.5">
          <animate attributeName="opacity" values="0.5;0.05;0.5" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
        </circle>
      </svg>
    </div>
  </div>

  <!-- Heading -->
  <div class="offline-label">OFFLINE</div>

  <!-- Card -->
  <div class="card">
    <div class="badge">
      <div class="badge-dot"></div>
      NO_CONNECTION
    </div>
    <div class="card-title">You're Not Connected</div>
    <div class="card-sub">
      Looks like your internet is off. Check your connection and try again <b>SubHub</b> will be right here waiting 😊
    </div>

    <!-- Status items -->
    <div class="status-row">
      <div class="status-item">
        <div class="status-dot red"></div>
        <span><span class="status-label">Internet</span> No connection detected</span>
      </div>
      <div class="status-item">
        <div class="status-dot yellow"></div>
        <span><span class="status-label">SubHub</span> Waiting to reconnect…</span>
      </div>
      <div class="status-item" id="cached-item" style="display:none;">
        <div class="status-dot green"></div>
        <span><span class="status-label">Cache</span> Some pages available offline</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="retryConnection()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.68-3.13"/>
        </svg>
        Try Again
      </button>
      <a href="/" class="btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Go Home
      </a>
    </div>
  </div>

</div>

<script>
  // Theme toggle
  const html = document.documentElement;
  const icon = document.getElementById('theme-icon');
  function toggleTheme() {
    const isLight = html.getAttribute('data-theme') === 'light';
    html.setAttribute('data-theme', isLight ? 'dark' : 'light');
    icon.innerHTML = isLight
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
      : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }

  // Sticker wobble
  function wobbleSticker() {
    const s = document.getElementById('sticker');
    s.classList.remove('wobble');
    void s.offsetWidth;
    s.classList.add('wobble');
    setTimeout(() => s.classList.remove('wobble'), 500);
  }

  // Retry
  function retryConnection() {
    window.location.reload();
  }

  // Show cached status item if service worker cache exists
  if ('caches' in window) {
    caches.keys().then(keys => {
      if (keys.length > 0) {
        document.getElementById('cached-item').style.display = 'flex';
      }
    });
  }

  // Auto-retry when connection comes back
  window.addEventListener('online', () => {
    window.location.reload();
  });
</script>
</body>
</html>
